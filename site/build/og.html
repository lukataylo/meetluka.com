<!doctype html>
<!-- Source for assets/og.png (1200×630). Re-render with any headless browser:
     screenshot this file at exactly 1200×630 and save over assets/og.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --ink:#131315;
  }
  *{box-sizing:border-box;margin:0}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    font-family:var(--sans);color:var(--ink);
    background:radial-gradient(120% 85% at 50% 6%,#f2f2f4 0%,#e9e9ec 55%,#dedee2 100%);
    display:flex;flex-direction:column;justify-content:center;padding:0 78px;
  }
  .ribbon{position:absolute;left:50%;top:62%;width:150%;height:36%;
    transform:translate(-50%,-50%);
    -webkit-mask-image:linear-gradient(to bottom,transparent,#000 26%,#000 74%,transparent),
                       linear-gradient(to right,transparent 2%,#000 24%,#000 76%,transparent 98%);
    -webkit-mask-composite:source-in;}
  .ribbon i{position:absolute;left:0;right:0;border-radius:50%;display:block}
  .ribbon i:nth-child(1){height:40%;top:30%;opacity:.55;filter:blur(46px) saturate(1.35);
    transform:rotate(-3.6deg);
    background:linear-gradient(95deg,transparent 6%,#4a8cff 19%,#63d8ff 30%,#dff6ff 40%,
      #fff 49%,#fff3d0 58%,#ffbb45 70%,#ff7a3d 82%,transparent 95%)}
  .ribbon i:nth-child(2){height:15%;top:42%;opacity:.8;filter:blur(15px) saturate(1.5);
    transform:rotate(-3deg);
    background:linear-gradient(94deg,transparent 14%,#2f7dff 27%,#7fe4ff 38%,#fff 50%,
      #ffdb8a 62%,#ff9a2e 74%,transparent 88%)}
  .ribbon i:nth-child(3){height:4%;top:47.5%;filter:blur(6px);transform:rotate(-3.2deg);
    background:linear-gradient(92deg,transparent 26%,#fff 45%,#fff 57%,transparent 76%)}

  .top{position:absolute;top:56px;left:78px;display:flex;align-items:center;gap:14px}
  .top svg{width:34px;height:34px}
  .top b{font-weight:400;font-size:23px;letter-spacing:-.01em}

  h1{position:relative;font-family:var(--serif);font-weight:400;font-size:86px;
    line-height:1.04;letter-spacing:-.02em;max-width:16ch}

  .foot{position:absolute;left:78px;bottom:56px;right:78px;
    display:flex;justify-content:space-between;align-items:flex-end;gap:32px}
  .foot p{font-size:21px;color:rgba(19,19,21,.62);max-width:46ch}
  .foot span{font:400 13px var(--mono);text-transform:uppercase;letter-spacing:.12em;
    color:rgba(19,19,21,.34);white-space:nowrap}
</style>
</head>
<body>
  <div class="ribbon"><i></i><i></i><i></i></div>

  <div class="top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
      <path d="M8.6 2.2H15.4L21.8 8.6V15.4L15.4 21.8H8.6L2.2 15.4V8.6Z"/>
    </svg>
    <b>Luka Dadiani</b>
  </div>

  <h1>Complicated products, made obvious</h1>

  <div class="foot">
    <p>Product manager and senior designer. Ten years making regulated, legacy-bound software feel obvious.</p>
    <span>London</span>
  </div>
</body>
</html>
