name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # The retired OS-style portfolio builds into dist/os (see `base` in
      # vite.config.ts); the static site in `site/` then owns the artifact root.
      # Order matters: Vite empties its own outDir, so it has to go first.
      - name: Build the retired portfolio into /os
        run: npm run build

      - name: Build and stage the main site at the root
        run: |
          node site/build/build.mjs
          cp -R site/. dist/
          rm -rf dist/build dist/README.md
          test -f dist/CNAME
          test -f dist/index.html
          test -f dist/os/index.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
